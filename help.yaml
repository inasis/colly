global: |
  사용법: {prog} <command> [옵션...]

  명령:
    crop     흰색 공백 기준으로 이미지를 세로로 분할
    merge    분할된 이미지들을 지정한 간격으로 다시 병합
    align    이미지 파일명을 랜덤 ID로 재정렬
    stack    접두·원본·접미 이미지를 지정한 순서로 겹쳐 합성

  공통 옵션:
    -R, --reference <폴더>   기준 프로젝트 폴더 (기본: colly.js가 있는 폴더)
    -D, --direct             output/ 대신 기준 프로젝트 폴더에서 직접 읽기
    -h, --help               도움말 표시

  각 명령의 자세한 사용법: {prog} <command> --help
  대화형 병합 도우미 실행: {prog} merge magic

crop: |
  사용법:
    {prog} crop [-R <폴더>] <최소공백높이>
    {prog} crop [-R <폴더>] -D <파일명> <최소공백높이>

  기준 프로젝트 폴더에서 PNG/JPG 원본 이미지 하나를 찾고
  세로 방향 흰색 공백이 <최소공백높이>px 이상인 지점을 기준으로
  분할합니다. 결과는 output/C001#H<높이>.png 형식으로 저장됩니다.
  (output/ 안의 기존 C*.* 파일은 실행 전 삭제됩니다)

  인자:
    <최소공백높이>   분할 기준이 되는 최소 흰색 공백 높이(px)

  옵션:
    -R, --reference <폴더>   기준 프로젝트 폴더 (기본: 현재 폴더)
    -D, --direct             처리할 원본 파일명을 직접 지정
    -h, --help               도움말 표시

  예:
    {prog} crop 15
    {prog} crop -R ../project 15
    {prog} crop -R ../project -D image.png 45

merge: |
  사용법:
    {prog} merge [-R <폴더>] [-D] [-P <prefix>] <gap> <번호|?파일명> [...] [-O <파일명>] [-B <픽셀>]
    {prog} merge [-R <폴더>] [-D] [-P <prefix>] --instant <번호|?파일명|파일명> [...] [-O <파일명>] [-B <픽셀>]
    {prog} merge -C <프리셋파일> <값1> [값2 ...]

  기준 프로젝트의 output/ 폴더에서 prefix와 번호가 일치하는 이미지들을 찾아
  지정한 간격(gap)으로 세로로 이어 붙입니다.
  -D를 사용하면 output/ 대신 기준 프로젝트 폴더에서 직접 읽습니다.

  대화형 모드:
    {prog} merge magic

    현재 작업 폴더의 output/ 안에 있는 PNG/JPG/WEBP 이미지를 차례로 보여주며
    사용할 이미지와 각 이미지 앞 간격을 대화식으로 결정합니다. 선택할 때마다
    실제 merge 결과를 미리보기로 만들고, 마지막에 하단 여백을 입력받아 현재
    작업 폴더에 merge.png를 생성합니다.

    대화형 모드는 -R, -D 및 다른 merge 옵션과 함께 사용할 수 없습니다.

  prefix 지정 방법:
    {prog} merge -P FeH7 0 001 ...       -P / --prefix 옵션으로 지정

  번호 매칭 규칙:
    <prefix>와 <번호> 사이의 "_"는 생략할 수 있으며,
    파일명 끝의 #H<높이> 태그도 선택사항입니다.

    예: prefix가 "C"일 때 아래 파일은 모두 001번으로 인식합니다.
      C001.png
      C001#H50.png
      C_001.png
      C_001#H50.png

    align 이전의 crop 결과물도 바로 병합할 수 있습니다.
    단, #H 태그가 없는 이미지에는 동적 간격(H보정)을 사용할 수 없습니다.

  직접 파일 지정:
    번호 대신 입력 폴더 안의 실제 파일명을 사용하려면 파일명 앞에 ?를 붙입니다.

    예:
      ?logo.png
      ?banner#H50.png

  instant 모드:
    --instant를 넣으면 각 이미지 앞의 gap 값을 생략하고 이미지만 나열합니다.
    모든 이미지 간격은 자동으로 0px가 됩니다.

    일반:
      {prog} merge --prefix FeH7 0 001 0 002 0 003

    instant:
      {prog} merge --prefix FeH7 --instant 001 002 003

    직접 파일은 ?파일명 또는 실제 파일명을 그대로 사용할 수 있습니다:
      {prog} merge --instant logo.png banner.png
      {prog} merge --instant ?logo.png ?banner.png

  간격(gap) 표기:
    <숫자>            고정 픽셀 간격
    <숫자>H<기준값>   파일의 실제 #H값에 따라 간격을 동적으로 보정

  동적 간격 계산:
    최종 간격 = 기본 간격 + (기준 H - 실제 H)

    예:
      입력 간격: 50H25
      실제 파일: FeH7_002#H23.png
      50 + (25 - 23) = 52px

  프리셋 파일:
    -C / --command-file을 사용하면 긴 merge 인자를 파일에서 읽을 수 있습니다.
    프리셋 안에서는 $1, $2, $3 ... 형식의 치환 변수를 사용할 수 있습니다.

    프리셋 파일 예시 (preset.txt):
      -P $1 0 001 50H25 $2 -O $3

    실행:
      {prog} merge -C preset.txt beJT 002 merged.png

    내부적으로 다음 명령과 동일하게 처리됩니다:
      {prog} merge -P beJT 0 001 50H25 002 -O merged.png

    대응 관계:
      $1 = beJT
      $2 = 002
      $3 = merged.png

    -C / --command-file은 merge 바로 뒤에 사용해야 하며,
    프리셋 파일명 뒤의 값들은 $1부터 순서대로 전달됩니다.

  옵션:
    -R, --reference <폴더>    기준 프로젝트 폴더 (기본: colly.js가 있는 폴더)
    -D, --direct              output/ 대신 기준 프로젝트 폴더에서 직접 읽기
    -P, --prefix <prefix>     prefix 지정
    -I, --instant             이미지 간격을 모두 0px로 사용하고 이미지만 입력
    -O, --output <파일명>     출력 파일명 (기본: merge.png)
    -B, --bottom <픽셀>       맨 아래에 추가할 여백 (기본: 0)
    -C, --command-file <파일> 프리셋 파일을 읽어 merge 인자로 확장
    -h, --help                도움말 표시

  예:
    {prog} merge -P FeH7 0 001 50 002 20 005
    {prog} merge -P FeH7 0 001 50H25 002 -O result.png -B 100
    {prog} merge -P FeH7 0 001 30 ?banner.png 20 002
    {prog} merge --prefix FeH7 --instant 001 002 005
    {prog} merge --instant logo.png banner.png
    {prog} merge -P C 0 001 20 002
    {prog} merge -R ../project -D -P C 0 001 20 002
    {prog} merge -C preset.txt beJT 002 merged.png

align: |
  사용법: {prog} align [-R <폴더>] [-D]

  기준 프로젝트의 output/ 폴더에 있는 C000#H숫자 ~ C999#H숫자 형식의
  이미지 파일명을 임의의 4자리 prefix로 재정렬합니다.
  -D를 사용하면 output/ 대신 기준 프로젝트 폴더에서 직접 처리합니다.

  옵션:
    -R, --reference <폴더>   기준 프로젝트 폴더 (기본: colly.js가 있는 폴더)
    -D, --direct             output/ 대신 기준 프로젝트 폴더에서 직접 처리
    -h, --help               도움말 표시

  예:
    {prog} align
    {prog} align -R ../project
    {prog} align -R ../project -D

stack: |
  사용법:
    {prog} stack [-R <폴더>] [-D] {-P <접두사> | -S <접미사>} [-A] [...]

  기준 프로젝트의 output/ 폴더에 있는 모든 이미지에 접두사 이미지와
  접미사 이미지를 겹쳐 합성하고, 결과를 기준 프로젝트의 stacked/ 폴더에
  저장합니다. -D를 사용하면 output/ 대신 기준 프로젝트 폴더의 이미지를
  직접 읽습니다.

  -P, -S, -A가 명령줄에 등장한 순서가 곧 합성 순서입니다.
  -A를 생략하면 원본 전체 항목(dest)이 마지막에 자동으로 추가됩니다.

  순서 예:
    -P "hello " -S " colly" -A
      접두사 → 접미사 → 원본

    -P "hello " -A -S " colly"
      접두사 → 원본 → 접미사

  옵션:
    -R, --reference <폴더>   기준 프로젝트 폴더 (기본: colly.js가 있는 폴더)
    -D, --direct             output/ 대신 기준 프로젝트 폴더에서 직접 읽기
    -P, --prefix <문자열>    접두사로 사용할 이미지 파일 식별 문자열
    -S, --suffix <문자열>    접미사로 사용할 이미지 파일 식별 문자열
    -A                       원본 파일 전체 항목을 이 위치에 배치
    -h, --help               도움말 표시

  제약:
    -P와 -S는 각각 한 번만 지정할 수 있습니다.
    -A는 한 번만 지정할 수 있습니다.
    -P 또는 -S 중 하나 이상이 필요합니다.

  예:
    {prog} stack -P "hello " -A -S " colly"
    {prog} stack -P "Pre " -S " copy"
    {prog} stack -R ../project -P "front " -A
    {prog} stack -R ../project -D -A -S " copy"
